[build]

[target.loongarch64-unknown-none]
rustflags = [
    "-Clink-arg=-Tsrc/hal/arch/loongarch64/linker.ld",
    "-Cforce-frame-pointers=yes",
]

[target.loongarch64-unknown-linux-gnu]
rustflags = [
    "-Clink-arg=-Tsrc/hal/arch/loongarch64/linker.ld",
    "-Clink-arg=-nostdlib",
    "-Clink-arg=-static",
    "-Cforce-frame-pointers=yes",
]
# 用 GNU 链接器而非 rust-lld：rust-lld 对 LoongArch 的重定位/relaxation 支持
# 不成熟，会把 boot.rs 里 la.global 取符号地址算错，导致内核启动跳飞、零输出挂死。
linker = "loongarch64-linux-gnu-gcc"

[target.riscv64gc-unknown-none-elf]
rustflags = [
    "-Clink-arg=-Tsrc/hal/arch/riscv/linker.ld",
    "-Cforce-frame-pointers=yes",
]

[source.crates-io]
replace-with = "vendored-sources"

[source.vendored-sources]
directory = "vendor"
