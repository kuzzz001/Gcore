[package]
name = "os"
version = "0.1.0"
edition = "2018"

[dependencies]
lazy_static = { version = "1.4.0", features = ["spin_no_std"] }
buddy_system_allocator = "0.8"
spin = "0.7"
bitflags = "1.3"
xmas-elf = "0.7.0"
embedded-hal = "=1.0.0-alpha.7"
nb = "1.0"
log = "0.4"
num_enum = { version = "0.5", default-features = false }
downcast-rs = { version = "1.2.0", default-features = false }
lz4_flex = { version = "0.9.0", default-features = false }
bit_field = "0.10.1"
rlibc = "1.0.0"
volatile = "0.3.0"
rand_core = "0.6.4"
managed = { version = "0.8", default-features = false, features = ["map"] }
virtio-drivers = { path = "../dependency/virtio-drivers", default-features = false, features = ["alloc"] }

rustsbi = { path = "../dependency/rustsbi" }

pci = {  path = "../dependency/dep_pci/pci"  }
isomorphic_drivers = { path = "../dependency/dep_iso" }

smoltcp = { version = "0.10.0", default-features = false, features = [
    "alloc",
    "log",
    "medium-ethernet",
    "medium-ip",
    "proto-ipv4",
    "proto-ipv6",
    "proto-dhcpv4",
    "proto-ipv4-fragmentation",
    "socket-udp",
    "socket-tcp",
    "socket-dhcpv4",
    "socket-raw",
    "socket-icmp",
    "async",
] }

[target.'cfg(target_arch = "riscv64")'.dependencies]
riscv = { path = "../dependency/riscv", features = ["inline-asm"] }

[features]
zero_init = []
swap = []
zram = []
oom_handler = ["swap", "zram"]
log_off = ["log/max_level_off"]
log_info = ["log/max_level_info"]
log_warn = ["log/max_level_warn"]
log_error = ["log/max_level_error"]
block_sata = []
block_mem = []
block_virt = []
block_virt_pci = []
comp = []
board_k210 = []
board_fu740 = []
board_cv1811h = []

# LoongArch Boards:
loongarch64 = []
board_2k1000 = ["oom_handler", "loongarch64"]
board_laqemu = ["oom_handler", "loongarch64"]
# Riscv Board:
riscv = []
board_rvqemu = ["oom_handler", "riscv"]
# END of LoongArch Boards.

# default = ["board_laqemu", "block_sata"]
# default = ["board_rvqemu", "block_mem"]
default = ["board_rvqemu", "block_virt", "oom_handler"]

[profile.dev]
opt-level = "s"
debug = 2
debug-assertions = false
overflow-checks = false
lto = false
panic = 'unwind'
incremental = false
codegen-units = 16
rpath = false
[profile.release]
lto = true
